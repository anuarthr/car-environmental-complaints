[project]
name = "car-environmental-complaints"
version = "0.1.0"
description = "ELT pipeline and analytics on environmental complaints filed with CAR Cundinamarca."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
