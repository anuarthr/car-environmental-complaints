[project]
name = "car-environmental-complaints"
version = "0.1.0"
description = "ELT pipeline and analytics on environmental complaints filed with CAR Cundinamarca."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlt[bigquery]>=1.32.0",
]

[dependency-groups]
dev = [
    "dlt[duckdb]>=1.32.0",
    "pytest>=9.2.0",
    "requests-mock>=1.12.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Tests are written before the package they import exists, so do not let ruff guess.
known-first-party = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
