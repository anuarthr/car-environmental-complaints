unit_tests:
  - name: test_stg_dane__municipalities_reads_only_the_latest_complete_release
    model: stg_dane__municipalities
    given:
      - input: source('dlt', '_dlt_loads')
        rows:
          - {load_id: "2024", status: 0}
          - {load_id: "2025", status: 0}
          - {load_id: "2026", status: 1}
      - input: source('dane', 'divipola_municipalities')
        rows:
          - {cod_mpio: "25001", nom_mpio: "AGUA DE DIOS", _dlt_load_id: "2024", _release_at: "2024-01-10 00:00:00"}
          - {cod_mpio: "25001", nom_mpio: "AGUA DE DIOS", _dlt_load_id: "2025", _release_at: "2025-01-24 20:44:32"}
          - {cod_mpio: "25001", nom_mpio: "AGUA DE DIOS", _dlt_load_id: "2026", _release_at: "2026-01-15 00:00:00"}
    expect:
      rows:
        - {municipality_code: "25001", released_at: "2025-01-24 20:44:32"}

  - name: test_stg_dane__municipalities_keeps_codes_as_text_and_parses_coordinates
    description: >
      DANE codes are identifiers with leading zeros (05001 is Medellín), so they stay text.
      Coordinates use a decimal comma.
    model: stg_dane__municipalities
    given:
      - input: source('dlt', '_dlt_loads')
        rows:
          - {load_id: "2025", status: 0}
      - input: source('dane', 'divipola_municipalities')
        rows:
          - cod_dpto: "05"
            dpto: "ANTIOQUIA"
            cod_mpio: "05001"
            nom_mpio: "MEDELLÍN"
            tipo_municipio: "Municipio"
            latitud: "6,25184"
            longitud: "-75,563591"
            _dlt_load_id: "2025"
            _release_at: "2025-01-24 20:44:32"
    expect:
      rows:
        - department_code: "05"
          department_name: "ANTIOQUIA"
          municipality_code: "05001"
          municipality_name: "MEDELLÍN"
          municipality_type: "Municipio"
          latitude: 6.25184
          longitude: -75.563591
